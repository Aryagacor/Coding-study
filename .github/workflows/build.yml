
name: Build CODING STUDY APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build CODING STUDY
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Find CODING STUDY ZIP
        run: |
          mkdir -p _source

          ZIP=$(find . -maxdepth 1 -type f \
            -iname '*coding*study*.zip' | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "ERROR: ZIP CODING STUDY tidak ditemukan!"
            exit 1
          fi

          echo "ZIP ditemukan: $ZIP"
          unzip -oq "$ZIP" -d _source

      - name: Detect CODING STUDY Project
        run: |
          PROJECT=$(find _source -type f \
            -name package.json \
            -not -path '*/node_modules/*' | head -n 1)

          if [ -z "$PROJECT" ]; then
            echo "ERROR: package.json tidak ditemukan!"
            exit 1
          fi

          DIR=$(dirname "$PROJECT")

          echo "PROJECT_DIR=$DIR" >> "$GITHUB_ENV"
          echo "Project: $DIR"

          if ! find "$DIR" -maxdepth 2 \
            -name 'capacitor.config.*' | grep -q .; then
            echo "ERROR: Konfigurasi Capacitor tidak ditemukan!"
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" \
            -name sdkmanager -type f | sort -V | tail -n 1)

          yes | "$SDKMANAGER" --licenses || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Install Dependencies
        run: |
          cd "$PROJECT_DIR"
          npm install

      - name: Build Web
        run: |
          cd "$PROJECT_DIR"
          npm run build

      - name: Add Android Platform
        run: |
          cd "$PROJECT_DIR"
          npx cap add android

      - name: Sync Android
        run: |
          cd "$PROJECT_DIR"
          npx cap sync android

      - name: Build APK
        run: |
          cd "$PROJECT_DIR/android"
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Verify APK
        run: |
          APK="$PROJECT_DIR/android/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK tidak ditemukan!"
            exit 1
          fi

          mkdir -p output
          cp "$APK" output/CODING-STUDY.apk

      - name: Upload CODING STUDY APK
        uses: actions/upload-artifact@v4
        with:
          name: CODING-STUDY-APK
          path: output/CODING-STUDY.apk
          if-no-files-found: error
