
name: Build CODING STUDY APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build CODING STUDY
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Extract Project ZIP
        run: |
          mkdir -p _source

          for file in *.zip; do
            if [ -f "$file" ]; then
              echo "Extracting $file"
              unzip -oq "$file" -d _source
            fi
          done

      - name: Detect Project Automatically
        run: |
          PROJECT=$(find . -type f -name package.json \
            -not -path './node_modules/*' \
            -not -path './_source/node_modules/*' \
            | head -n 1)

          if [ -z "$PROJECT" ]; then
            echo "ERROR: package.json tidak ditemukan."
            echo "Periksa apakah ZIP proyek sudah diupload."
            exit 1
          fi

          DIR=$(dirname "$PROJECT")
          echo "PROJECT_DIR=$DIR" >> "$GITHUB_ENV"
          echo "Project ditemukan: $DIR"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android SDK
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" \
            -name sdkmanager -type f | sort -V | tail -n 1)

          yes | "$SDKMANAGER" --licenses || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Install Dependencies
        run: |
          cd "$PROJECT_DIR"
          npm install

      - name: Build Web App
        run: |
          cd "$PROJECT_DIR"
          npm run build

      - name: Create Android Platform
        run: |
          cd "$PROJECT_DIR"
          npx cap add android

      - name: Sync Android
        run: |
          cd "$PROJECT_DIR"
          npx cap sync android

      - name: Build APK
        run: |
          cd "$PROJECT_DIR/android"
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CODING-STUDY-APK
          path: '**/app/build/outputs/apk/debug/app-debug.apk'
          if-no-files-found: error
